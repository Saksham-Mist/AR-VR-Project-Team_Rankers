<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Transformation Learning Environment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="main.js" defer></script>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background:#0f172a;
  color:#e5e7eb;
}

#container {
  display:flex;
  height:100vh;
}

#scene {
  flex:3;
}

#controls {
  flex:1;
  padding:20px;
  background:#1e293b;
  overflow-y:auto;
  box-shadow: -5px 0 20px rgba(0,0,0,0.4);

}

h2, h3 {
  margin-top:18px;
  color:#3fa7ff;
}

input[type="range"] {
  width:100%;
  margin-top:5px;
  margin-bottom:15px;
}

label {
  font-size:14px;
}

button {
  padding:8px 14px;
  background:#3fa7ff;
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
  margin-top:10px;
}

button:hover {
  background:#2b8ce6;
}

pre, #history {
  background:#0f172a;
  padding:10px;
  font-size:12px;
  border-radius:4px;
  margin-top:10px;
}

#history {
  max-height:120px;
  overflow:auto;
}
</style>
</head>

<body>

<div id="container">
<div id="scene"></div>

<div id="controls">

<h2>Translation</h2>
X <input type="range" id="tx" min="-5" max="5" step="0.1" value="0">
Y <input type="range" id="ty" min="-5" max="5" step="0.1" value="0">
Z <input type="range" id="tz" min="-5" max="5" step="0.1" value="0">

<h2>Rotation</h2>
X <input type="range" id="rx" min="0" max="360" value="0">
Y <input type="range" id="ry" min="0" max="360" value="0">
Z <input type="range" id="rz" min="0" max="360" value="0">

<h2>Scale</h2>
X <input type="range" id="sx" min="0.5" max="3" step="0.1" value="1">
Y <input type="range" id="sy" min="0.5" max="3" step="0.1" value="1">
Z <input type="range" id="sz" min="0.5" max="3" step="0.1" value="1">

<br>
<label><input type="checkbox" checked onchange="toggleAxes(this.checked)"> Show Axes</label><br>
<label><input type="checkbox" checked onchange="toggleBreakdown(this.checked)"> Show Matrix Breakdown</label>

<br>
<button onclick="resetObject()">Reset</button>
<br><br>
<button onclick="openAR()">Open Camera Mode</button>

<h3>Transformation Matrix</h3>
<pre id="matrixDisplay"></pre>

<h3>Transformation History</h3>
<div id="history"></div>

</div>
</div>


</body>
</html>
