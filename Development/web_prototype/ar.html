<!DOCTYPE html>
<html>

<head>
  <title>AR Mode</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #controls button {
      padding: 8px 12px;
      background: #3fa7ff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<div id="controls">
  <button onclick="changeShape('tetrahedron')">Tetra</button>
  <button onclick="changeShape('box')">Cube</button>
  <button onclick="changeShape('octahedron')">Octa</button>
  <button onclick="changeShape('dodecahedron')">Dodeca</button>
  <button onclick="changeShape('icosahedron')">Icosa</button>

  <br>
  <button onclick="sendToMain()">Use This Solid</button>
</div>

<!-- 🔹 AR SCENE -->
<a-scene embedded arjs vr-mode-ui="enabled: false">
  <a-marker preset="hiro">
    <a-entity id="solid"
      geometry="primitive: dodecahedron"
      material="color: red"
      position="0 0.5 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- 🔹 SCRIPT (BOTTOM) -->
<script>
let currentShape = "dodecahedron";
let markerVisible = false;

// 🔹 Detect marker visibility
const marker = document.querySelector("a-marker");

marker.addEventListener("markerFound", () => {
  markerVisible = true;
});

marker.addEventListener("markerLost", () => {
  markerVisible = false;
});

// 🔹 Change shape in AR preview
function changeShape(shape) {
  currentShape = shape;

  document.getElementById("solid")
    .setAttribute("geometry", "primitive: " + shape);
}

// 🔹 Send selected shape to main scene
function sendToMain() {

  if (!markerVisible) {
    alert("Show marker first!");
    return;
  }

  localStorage.setItem("selectedShape", currentShape);
  window.location.href = "index.html";
}

// 🔹 Back button
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
